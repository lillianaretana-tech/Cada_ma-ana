<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f2e8"><title>Mi Biblia · Cada Mañana</title><style>:root{--green:#0f4f4b;--paper:#fffdf8;--cream:#fbf7ef}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#253332;font:17px/1.6 Georgia,serif}.wrap{max-width:780px;margin:auto;padding:18px}.top{background:var(--green);color:white;padding:24px;border-radius:0 0 24px 24px}.top a{color:#fff;text-decoration:none;font:600 14px Arial}.top h1{margin:12px 0 0;font-size:36px}.top p{margin:0;opacity:.9}.panel{background:var(--paper);border:1px solid #e3e9df;border-radius:20px;padding:20px;margin-top:18px;box-shadow:0 8px 24px #173b3a10}label{display:block;font:700 13px Arial;color:var(--green);margin-bottom:5px}select,input,button{font:15px Arial;padding:12px;border-radius:12px;border:1px solid #ccd9d3;background:white;color:#253332}select,input{width:100%}button{cursor:pointer;background:var(--green);color:white;border:0}.grid{display:grid;grid-template-columns:2fr 1fr;gap:12px}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:15px}.nav button{flex:1}.verse{margin:0 0 13px}.verse sup{color:#a36c04;font:bold 12px Arial;margin-right:8px}.reader{font-size:var(--font-size,19px);line-height:1.85}.reader h2{color:var(--green);font-size:27px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.toolbar button{padding:8px 13px}.muted{font:13px/1.5 Arial;color:#63716d}.error{color:#a23232}.results button{display:block;width:100%;text-align:left;margin:7px 0;background:#eef5f1;color:#173b3a}.searchline{display:flex;gap:8px}.searchline input{flex:1}footer{text-align:center;padding:24px;color:#6c7774;font:12px Arial}@media(max-width:450px){.grid{grid-template-columns:1fr}.wrap{padding:12px}.top{padding:20px}}</style></head><body><header class="top"><div class="wrap" style="padding:0"><a href="./">← Volver a Cada Mañana</a><h1>📖 Mi Biblia</h1><p>Reina-Valera 1909 · 66 libros</p></div></header><main class="wrap"><section class="panel"><div class="grid"><div><label for="book">Libro</label><select id="book"></select></div><div><label for="chapter">Capítulo</label><select id="chapter"></select></div></div><div class="nav"><button id="prev">← Anterior</button><button id="next">Siguiente →</button></div><div class="toolbar"><span class="muted">Tamaño de letra</span><button id="smaller" aria-label="Reducir letra">A−</button><button id="bigger" aria-label="Aumentar letra">A+</button></div></section><section class="panel"><label for="query">Buscar en el capítulo o ir a una referencia</label><div class="searchline"><input id="query" placeholder="Ej.: amor, Juan 3:16" autocomplete="off"><button id="search">Buscar</button></div><p class="muted">Busca palabras en el capítulo abierto o escribe una referencia para ir directamente a ella.</p><div class="results" id="results"></div></section><section class="panel"><div id="status" class="muted" aria-live="polite">Cargando libros…</div><div id="reader" class="reader"></div></section><footer>Texto bíblico: Reina-Valera 1909 · Fuente GetBible · Requiere conexión a Internet</footer></main><script>
const ROOT='https://api.getbible.net/v2/valera',B=document.getElementById('book'),C=document.getElementById('chapter'),R=document.getElementById('reader'),S=document.getElementById('status'),Q=document.getElementById('query'),RES=document.getElementById('results');let books={},chapters={},verses=[],font=Number(localStorage.getItem('biblia-font')||19),selectedVerse=null;R.style.setProperty('--font-size',font+'px');
async function json(url){const r=await fetch(url);if(!r.ok)throw Error('No se pudo descargar el texto bíblico.');return r.json()}
function values(data){return Array.isArray(data)?data:Object.values(data)}
function options(select,arr,selected){select.innerHTML='';arr.forEach(x=>{const o=document.createElement('option');o.value=String(x.id);o.textContent=x.label;select.append(o)});if(selected!==undefined)select.value=String(selected)}
function nameOf(b){return b.name||b.book_name||''}
function updateURL(){history.replaceState(null,'','?libro='+encodeURIComponent(B.value)+'&capitulo='+encodeURIComponent(C.value))}
async function init(){try{books=await json(ROOT+'/books.json');const list=Object.entries(books).map(([id,b])=>({id,label:nameOf(b)}));options(B,list);const p=new URLSearchParams(location.search);B.value=books[p.get('libro')]?p.get('libro'):'43';await loadBook(p.get('capitulo')||'1');}catch(e){S.textContent=e.message;S.className='error'}}
async function loadBook(wanted){try{S.textContent='Cargando capítulos…';chapters=await json(ROOT+'/'+B.value+'/chapters.json');const list=Object.entries(chapters).map(([id])=>({id,label:'Capítulo '+id}));options(C,list,chapters[wanted]?wanted:'1');await loadChapter()}catch(e){S.textContent=e.message;S.className='error'}}
function extract(data){const v=data.verses||data;return values(v).filter(x=>x&&typeof x==='object'&&('text'in x||'verse'in x||'verse_nr'in x)).map((x,i)=>({n:Number(x.verse||x.verse_nr||x.nr||i+1),text:String(x.text||x.verse_text||'')})).filter(x=>x.text)}
async function loadChapter(){try{S.className='muted';S.textContent='Cargando versículos…';R.replaceChildren();RES.replaceChildren();const data=await json(ROOT+'/'+B.value+'/'+C.value+'.json');verses=extract(data);if(!verses.length)throw Error('No se encontraron versículos en este capítulo.');const h=document.createElement('h2');h.textContent=nameOf(books[B.value])+' '+C.value;R.append(h);for(const v of verses){const p=document.createElement('p');p.className='verse';p.id='v'+v.n;const sup=document.createElement('sup');sup.textContent=v.n;const span=document.createElement('span');span.textContent=v.text;p.append(sup,span);R.append(p)}S.textContent=verses.length+' versículos · Reina-Valera 1909';updateURL();if(selectedVerse){const el=document.getElementById('v'+selectedVerse);if(el){el.style.background='#fff0c9';el.scrollIntoView({block:'center'})}selectedVerse=null}}catch(e){S.textContent=e.message;S.className='error'}}
B.addEventListener('change',()=>loadBook('1'));C.addEventListener('change',loadChapter);function move(d){const n=Number(C.value)+d;if(chapters[n]){C.value=String(n);loadChapter()}else{const b=Number(B.value)+Math.sign(d);if(books[b]){B.value=String(b);loadBook(d<0?'999':'1').then(()=>{if(d<0){C.value=String(Object.keys(chapters).length);loadChapter()}})}}}document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);
document.getElementById('smaller').onclick=()=>resize(-2);document.getElementById('bigger').onclick=()=>resize(2);function resize(d){font=Math.max(15,Math.min(32,font+d));R.style.setProperty('--font-size',font+'px');localStorage.setItem('biblia-font',font)}
function normalize(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}function search(){const q=Q.value.trim();RES.replaceChildren();if(!q)return;const match=q.match(/^(.+?)\s+(\d+)(?::(\d+))?$/);if(match){const b=Object.entries(books).find(([id,obj])=>normalize(nameOf(obj))===normalize(match[1]));if(b){B.value=b[0];selectedVerse=match[3]?Number(match[3]):null;loadBook(match[2]);return}}const found=verses.filter(v=>normalize(v.text).includes(normalize(q)));const msg=document.createElement('p');msg.className='muted';msg.textContent=found.length?found.length+' coincidencia(s) en este capítulo.':'Sin coincidencias en este capítulo.';RES.append(msg);found.forEach(v=>{const btn=document.createElement('button');btn.textContent='Versículo '+v.n+': '+v.text.slice(0,140);btn.onclick=()=>document.getElementById('v'+v.n)?.scrollIntoView({behavior:'smooth',block:'center'});RES.append(btn)})}document.getElementById('search').onclick=search;Q.addEventListener('keydown',e=>{if(e.key==='Enter')search()});init();
</script></body></html>
