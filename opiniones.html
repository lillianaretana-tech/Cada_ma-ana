<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opiniones · Cada Mañana</title><style>:root{font-family:Arial,sans-serif;color:#173b3a;background:#fbf7ef}body{margin:0;padding:22px}.wrap{max-width:800px;margin:auto}h1{font:normal 36px Georgia,serif}p{line-height:1.6}.box,.item{background:#fffdf8;border:1px solid #d8e4dc;border-radius:20px;padding:20px;margin:15px 0}input{font:inherit;padding:13px;border:1px solid #a8c0b5;border-radius:12px;max-width:100%;width:320px}button{background:#0f4f4b;color:#fff;border:0;border-radius:25px;padding:13px 20px;cursor:pointer;font-weight:bold;margin:8px 6px 8px 0}.muted{color:#687674;font-size:14px}.item h3{margin:0 0 7px}a{color:#0f4f4b}#dashboard{display:none}</style></head><body><main class="wrap"><p><a href="./">← Volver a Cada Mañana</a></p><h1>💙 Opiniones de Cada Mañana</h1><p>Un espacio privado para escuchar a quienes reciben nuestras lecturas.</p><section class="box" id="login"><h2>Acceso privado</h2><p>Recibirás un enlace para entrar en tu correo autorizado. No necesitas contraseña.</p><form id="emailForm"><label for="email">Correo electrónico</label><p><input id="email" type="email" value="iretana@yahoo.com" required autocomplete="email"></p><button>Enviar enlace de acceso</button></form><p class="muted" id="loginStatus" role="status"></p></section><section id="dashboard"><button id="refresh">Actualizar opiniones</button><button id="logout">Cerrar sesión</button><p id="count"></p><div id="items"></div></section></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const url='https://lszjnrjgbhsfrdvhhfvg.supabase.co',key='sb_publishable_TDfU5a0wYh5FG0_87_LdYw_YNpZLXqS',client=createClient(url,key,{auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true}});
const el=id=>document.getElementById(id),authorized='iretana@yahoo.com';
async function show(){const {data:{session}}=await client.auth.getSession();if(!session||session.user.email?.toLowerCase()!==authorized){el('login').style.display='block';el('dashboard').style.display='none';return;}el('login').style.display='none';el('dashboard').style.display='block';await load(session.access_token)}
async function load(token){el('count').textContent='Cargando opiniones...';try{const res=await fetch(url+'/functions/v1/panel-opiniones-cada-manana',{headers:{Authorization:'Bearer '+token,apikey:key}});const body=await res.json();if(!res.ok)throw Error(body.error||'Error de acceso');const opinions=body.opiniones||[];el('count').textContent=opinions.length+' opiniones registradas (máximo 250 recientes)';el('items').replaceChildren();if(!opinions.length){const p=document.createElement('p');p.textContent='Todavía no hay opiniones. 🌷';el('items').append(p)}for(const o of opinions){const card=document.createElement('article');card.className='item';const h=document.createElement('h3');h.textContent=o.experiencia;const d=document.createElement('p');d.className='muted';d.textContent=new Date(o.created_at).toLocaleString('es-CR',{dateStyle:'long',timeStyle:'short'});card.append(h,d);if(o.sugerencia){const p=document.createElement('p');p.textContent='Sugerencia: '+o.sugerencia;card.append(p)}if(o.mensaje){const p=document.createElement('p');p.textContent='Mensaje: '+o.mensaje;card.append(p)}el('items').append(card)}}catch(e){el('count').textContent=e.message}}
el('emailForm').onsubmit=async e=>{e.preventDefault();const email=el('email').value.trim().toLowerCase();if(email!==authorized){el('loginStatus').textContent='Este correo no está autorizado.';return}el('loginStatus').textContent='Enviando enlace...';const {error}=await client.auth.signInWithOtp({email,options:{emailRedirectTo:'https://lillianaretana-tech.github.io/Cada_ma-ana/opiniones.html',shouldCreateUser:true}});el('loginStatus').textContent=error?'No se pudo enviar: '+error.message:'Revisa tu correo, incluyendo la carpeta de spam. 💙'};
el('refresh').onclick=show;el('logout').onclick=async()=>{await client.auth.signOut();show()};client.auth.onAuthStateChange(()=>{setTimeout(show,0)});show();
</script></body></html>
